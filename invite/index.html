<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game invitation — Padel-Up</title>
  <meta name="description" content="Open a shared padel game in the Padel-Up mobile app.">
  <link rel="stylesheet" href="../css/style.css?v=1.1.14">
  <link rel="icon" href="../assets/images/padel_up_icon_192.png">
  <style>
    .invite-page {
      align-items: center;
      display: flex;
      min-height: calc(100vh - 170px);
      padding: 32px 20px;
    }

    .invite-card {
      margin: 0 auto;
      max-width: 560px;
      text-align: center;
      width: 100%;
    }

    .invite-icon {
      border-radius: 18px;
      height: 72px;
      margin-bottom: 12px;
      width: 72px;
    }

    .invite-card h1 {
      font-size: 2rem;
      line-height: 1.2;
      margin: 0 0 10px;
    }

    .invite-message {
      color: var(--text-muted);
      margin: 0 auto 22px;
      max-width: 430px;
    }

    .invite-actions {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .invite-actions .btn {
      width: 100%;
    }

    .invite-error {
      color: #b91c1c;
      font-weight: 600;
    }

    .open-app-dialog {
      border: 0;
      border-radius: var(--radius);
      box-shadow: 0 16px 48px rgba(15, 23, 42, 0.28);
      max-width: 500px;
      padding: 0;
      width: calc(100% - 32px);
    }

    .open-app-dialog::backdrop {
      background: rgba(15, 23, 42, 0.58);
    }

    .dialog-content {
      padding: 24px;
    }

    .dialog-content h2 {
      line-height: 1.25;
      margin: 0 0 10px;
    }

    .dialog-content p {
      color: var(--text-muted);
      margin: 0 0 16px;
    }

    .deep-link-target {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: block;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      margin-bottom: 18px;
      overflow-wrap: anywhere;
      padding: 10px;
      text-align: left;
      user-select: all;
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .dialog-actions .btn {
      padding: 10px 18px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="../index.html" class="logo">
        <img src="../assets/images/padel_up_icon_192.png" alt="Padel-Up icon" width="32" height="32">
        <span>Padel-Up</span>
      </a>
    </div>
  </header>

  <main class="invite-page">
    <section class="card invite-card" aria-labelledby="invite-title">
      <img
        class="invite-icon"
        src="../assets/images/padel_up_icon_192.png"
        alt=""
        width="72"
        height="72"
      >
      <h1 id="invite-title">Game invitation received</h1>
      <p id="invite-message" class="invite-message">
        Open this shared game in the Padel-Up app.
      </p>

      <div class="invite-actions">
        <a id="open-app" class="btn btn-primary" href="#" hidden>Open Padel-Up</a>
        <a
          class="btn btn-blue"
          href="https://apps.apple.com/us/app/padel-up/id6759841735"
          target="_blank"
          rel="noopener"
        >
          Download on the App Store
        </a>
        <a
          class="btn btn-secondary"
          href="https://play.google.com/store/apps/details?id=com.anonymous.padelup"
          target="_blank"
          rel="noopener"
        >
          Get it on Google Play
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© Padel-Up. Matching players, not courts.</div>
      <div><a href="../support.html">Support</a></div>
    </div>
  </footer>

  <dialog id="open-app-dialog" class="open-app-dialog">
    <div class="dialog-content">
      <h2 id="dialog-title">Unable to open Padel-Up</h2>
      <p id="dialog-message"></p>
      <code id="deep-link-target" class="deep-link-target"></code>
      <div class="dialog-actions">
        <button id="close-dialog" class="btn btn-secondary" type="button">Close</button>
      </div>
    </div>
  </dialog>

  <script>
    (() => {
      const positiveGameIdPattern = /^[1-9]\d*$/;
      const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      const parameters = new URLSearchParams(window.location.search);
      const gameId = parameters.get('gameId') || '';
      const sharedBy = parameters.get('sharedBy') || '';
      const sharedByName = parameters.get('sharedByName') || '';
      const title = document.getElementById('invite-title');
      const message = document.getElementById('invite-message');
      const openAppLink = document.getElementById('open-app');
      const dialog = document.getElementById('open-app-dialog');
      const dialogTitle = document.getElementById('dialog-title');
      const dialogMessage = document.getElementById('dialog-message');
      const deepLinkTarget = document.getElementById('deep-link-target');
      const closeDialogButton = document.getElementById('close-dialog');

      if (!positiveGameIdPattern.test(gameId) || !Number.isSafeInteger(Number(gameId))) {
        message.textContent = 'This invitation link is invalid or incomplete.';
        message.classList.add('invite-error');
        return;
      }

      const appUrl = new URL('padelup:///invite');
      appUrl.searchParams.set('gameId', gameId);
      const validSharedBy = uuidPattern.test(sharedBy);
      const normalizedSharerName = Array.from(sharedByName)
        .filter((character) => {
          const characterCode = character.charCodeAt(0);
          return characterCode >= 32 && characterCode !== 127;
        })
        .join('')
        .trim();
      const validSharerName =
        validSharedBy && normalizedSharerName.length > 0 && normalizedSharerName.length <= 80;

      if (validSharedBy) {
        appUrl.searchParams.set('sharedBy', sharedBy);
      }
      if (validSharerName) {
        appUrl.searchParams.set('sharedByName', normalizedSharerName);
        title.textContent = `Invitation from ${normalizedSharerName}`;
      }

      message.textContent = `Open shared game #${gameId} in Padel-Up.`;
      openAppLink.href = appUrl.toString();
      openAppLink.hidden = false;

      const showOpenAppDialog = (title, explanation) => {
        dialogTitle.textContent = title;
        dialogMessage.textContent = explanation;
        deepLinkTarget.textContent = appUrl.toString();
        dialog.showModal();
      };

      const attemptToOpenApp = () => {
        window.location.href = appUrl.toString();
      };

      openAppLink.addEventListener('click', (event) => {
        event.preventDefault();

        const mobileUserAgent = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const reportsMobile = navigator.userAgentData && navigator.userAgentData.mobile;
        if (!mobileUserAgent && !reportsMobile) {
          showOpenAppDialog(
            'Mobile app required',
            'This button uses a mobile deep link. A desktop browser has no Padel-Up handler. Use a phone with Padel-Up installed. The diagnostic deep link is shown below for development testing.'
          );
          return;
        }

        let pageWasHidden = false;
        const markPageHidden = () => {
          if (document.hidden) {
            pageWasHidden = true;
          }
        };

        document.addEventListener('visibilitychange', markPageHidden);
        attemptToOpenApp();

        window.setTimeout(() => {
          document.removeEventListener('visibilitychange', markPageHidden);
          if (!pageWasHidden && !document.hidden) {
            showOpenAppDialog(
              'Padel-Up did not open',
              'The app is not installed, or this browser could not open it. Install Padel-Up from the store. The diagnostic deep link is shown below for development testing.'
            );
          }
        }, 1800);
      });

      closeDialogButton.addEventListener('click', () => dialog.close());
    })();
  </script>
</body>
</html>
